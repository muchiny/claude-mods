name: Mutation testing

# Long (≈ 3 900 mutants, une exécution de `claude plugin test` chacun) : hebdomadaire et à la demande,
# jamais à chaque push. Un job par module pour répartir la charge.
# register.tsx est exclu : le moteur lit les noms d'événements de `on()` dans la source, et
# l'instrumentation de Stryker les enveloppe dans un ternaire (le module ne se charge plus).
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutate:
    name: mutate ${{ matrix.file }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        file: [bridge.ts, colors.ts, fr.ts, state.ts, superpowers.ts, view.ts, workflow.ts]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Stryker
        run: npx stryker run --mutate "mode-clair/hooks/${{ matrix.file }}" --concurrency 3 --reporters clear-text,html,json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-${{ matrix.file }}
          path: reports/mutation
          if-no-files-found: ignore

  # Planchers par module (dev/mutation-floors.json) : mutation complète des modules purs sous Bun.
  floors:
    name: planchers de mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stryker (modules purs)
        run: npm run mutate:pure

      - name: Planchers
        run: node dev/mutation-floors.mjs reports/mutation-pure/mutation.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-pure
          path: reports/mutation-pure
          if-no-files-found: ignore

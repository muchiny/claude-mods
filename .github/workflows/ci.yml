name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Biome : lint, format et tri des imports, warnings comptés comme erreurs.
      - name: Biome
        run: npx biome ci . --error-on-warnings

      # Les types de l'API des mods sont dans dev/claude-code.d.ts (Claude Code 2.1.302).
      - name: TypeScript
        run: npx tsc -p tsconfig.json

      - name: Audit des dépendances de développement
        run: npm audit --audit-level=high

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # bun:test remplace 'claude-code/testing' (dev/bun-claude-code-testing.ts) ; seuil de 100 %
      # des lignes et des fonctions dans bunfig.toml. register.tsx n'est exercé que par les tests moteur.
      - name: Coverage
        run: npm run coverage

      - name: Tests des outils de développement
        run: npm run test:dev

  mutation-pr:
    name: mutation-pr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Mutants des seules lignes de mode-clair/hooks ajoutées ou modifiées depuis la base de la PR :
      # un seul mutant survivant fait échouer le job (seuil break = 100, stryker.pure.json).
      - name: Mutation des lignes modifiées
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node dev/mutation-gate.mjs --base "origin/$BASE_REF"

  props-golden:
    name: props-golden
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tests/ : propriétés fast-check (graine 42, 200 exécutions), goldens de rendu, outils de dev.
      - name: Propriétés, goldens, outils de développement
        run: npm run test:dev

      # tools.generated.ts vient de `bridge-mcp --json list-tools` (pas de générateur dans le dépôt) :
      # on vérifie seulement sa forme.
      - name: Forme de tools.generated.ts
        run: node dev/check-tools.mjs

  actions-lint:
    name: actions-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint : binaire officiel vérifié par sa somme SHA-256
      # (actionlint_1.7.12_checksums.txt de la release v1.7.12).
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.30.1 --min-severity medium .github/workflows

  mod:
    name: mod (${{ matrix.claude }}, node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Deux couples (version minimale annoncée par le mod / dernière version), pas un produit croisé.
    strategy:
      fail-fast: false
      matrix:
        include:
          - claude: '2.1.296'
            node: 22
          - claude: latest
            node: 24
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # Les mods demandent Claude Code 2.1.296 ou plus récent : on teste ce minimum et latest.
      - name: Install Claude Code
        env:
          CLAUDE_VERSION: ${{ matrix.claude }}
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_VERSION}"

      - run: claude --version

      - name: Validate marketplace
        run: claude plugin validate .

      - name: Validate mode-clair
        run: claude plugin validate mode-clair

      - name: Test mode-clair
        run: claude plugin test mode-clair

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Ce dépôt est public : aucun chemin personnel ni secret ne doit y entrer.
      - name: No personal paths or secret-like strings
        run: |
          if grep -rInE '/home/(muchini|loic)|gho_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9_-]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude=ci.yml --exclude=package-lock.json .; then
            echo "::error::Chemin personnel ou secret détecté"
            exit 1
          fi

      # Fixtures de rejeu (dev/replay/extract.ts) : formes anonymisées seulement. Aucun chemin
      # /home/<nom> autre que /home/user, adresse e-mail ou IP, identifiant d'appel réel (les
      # synthétiques sont toolu_rNNNN), jeton ou suite hexadécimale longue.
      - name: Replay fixtures are anonymised
        run: |
          if grep -rnP --include='*.ts' '/home/(?!user\b)|-home-(?!user\b)[A-Za-z0-9]|[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.[A-Za-z]{2,}|(?<![\d.])(?:\d{1,3}\.){3}\d{1,3}(?![\d.])|toolu_(?!r\d{4}\b)[A-Za-z0-9]+|\bsk-[A-Za-z0-9_-]{10,}|\bxox[abprs]-|[0-9a-fA-F]{32,}' \
              mode-clair/tests/replay/; then
            echo "::error::Fixture de rejeu non anonymisée"
            exit 1
          fi

      # gitleaks sur tout l'historique, binaire officiel vérifié par sa somme SHA-256
      # (gitleaks_8.30.1_checksums.txt de la release v8.30.1). Faux positifs : .gitleaksignore.
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact
